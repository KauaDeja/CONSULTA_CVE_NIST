name: Monitoramento Semanal de CVEs

on:
  schedule:
    # Roda todas as quintas-feiras às 00:00
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  executar-varredura:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar pacotes necessários
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Rodar script de busca no NIST
        env:
          # Variáveis necessárias para a API e para o envio do e-mail
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TARGET: ${{ secrets.EMAIL_TARGET }}
        run: python monitor.py

      - name: Salvar histórico e atualizar Excel no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add cve_tracker.log relatorio_cves_recentes.xlsx
          
          git commit -m "chore: atualiza relatorio excel e log de rastreamento" || echo "Sem novas atualizações para salvar"
          git push
